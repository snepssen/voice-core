name: release

# Release voice-core from the Actions tab: give a version (like 1.0.3); the
# tests run on macOS and, if they pass, the version is tagged and pushed. Each
# app's own daily "voice-core" workflow then moves to it after that app's
# checks pass (or start one by hand to have it at once). scripts/release.sh
# does the same from a Mac with the apps checked out beside this one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: the version to release, like 1.0.3
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The version is new and well formed
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a version: ${{ inputs.version }}"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/${{ inputs.version }}" || { echo "${{ inputs.version }} already exists"; exit 1; }
      - run: swift test
      - name: Tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "voice-core ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"
